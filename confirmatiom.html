<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinemaholic Hub | Order Confirmed</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <nav class="navbar">
    <div class="logo">
      <i class="fas fa-film"></i>
      <span>CINEMAHOLIC</span><span class="hub"> HUB</span>
    </div>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="snacks.html">Snacks</a>
      <a href="activity.html">My Activity</a>
      <a href="#">My Bookings</a>
    </div>
    <div class="nav-right">
      <div class="search-bar">
        <input type="text" placeholder="Search movies...">
        <i class="fas fa-search"></i>
      </div>
      <div class="icon-circle"><i class="far fa-bell"></i></div>
      <div class="icon-circle"><i class="far fa-user"></i></div>
    </div>
  </nav>

  <div class="confirm-page">
    <div class="confirm-card">
      <div class="confirm-icon">
        <i class="fas fa-check-circle"></i>
      </div>
      <h1>Order Confirmed!</h1>
      <p class="confirm-sub">Your order has been placed successfully.</p>
      <div class="confirm-order-id" id="confirmOrderId"></div>

      <div class="confirm-details" id="confirmDetails"></div>

      <div class="confirm-pickup">
        <i class="fas fa-map-marker-alt"></i>
        <div>
          <strong>Pickup Location</strong>
          <p>Main Mall Cinema Counter, Gaborone</p>
          <p style="color:#e50914; font-size:12px; margin-top:4px;">Ready in 10–15 minutes</p>
        </div>
      </div>

      <div class="confirm-actions">
        <a href="activity.html"><button class="pay-btn">View My Activity</button></a>
        <a href="home.html"><button class="hold-btn">Back to Home</button></a>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const orderId  = localStorage.getItem('ch_lastOrderId') || '#FOOD0000';
  const activity = JSON.parse(localStorage.getItem('ch_activity') || '[]');
  const order    = activity.find(a => a.id === orderId);

  document.getElementById('confirmOrderId').textContent = `Order ID: ${orderId}`;

  if (order) {
    document.getElementById('confirmDetails').innerHTML = order.items.map(item => `
      <div class="confirm-item">
        <img src="${item.img}" alt="${item.name}">
        <span>${item.name} × ${item.qty}</span>
        <span class="red">P${item.price * item.qty}.00</span>
      </div>`).join('') + `
      <div class="confirm-total">
        <span>Total Paid</span>
        <span class="red" style="font-size:18px; font-weight:800;">P${order.total}.00</span>
      </div>`;
  }
});
</script>
</body>
</html>
